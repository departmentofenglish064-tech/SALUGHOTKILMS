    function bindTeacherHandlers() {
      document.querySelectorAll("[data-take-att]").forEach(btn => {
        btn.onclick = async () => {
          window.__attParams = {
            sid: btn.dataset.takeAtt,
            batch: btn.dataset.batch,
            subject: btn.dataset.subject
          };
          activeTab = "attendance";
          renderTeacher();
        };
      });

      // Attendance toggles
      document.querySelectorAll(".att-row .att-toggle button").forEach(btn => {
        btn.onclick = () => {
          const row = btn.closest(".att-row");
          const present = btn.dataset.p === "1";
          row.classList.toggle("present", present);
          row.classList.toggle("absent", !present);
          row.querySelectorAll("button").forEach(b => {
            b.className = "btn btn-sm btn-outline";
            if ((b.dataset.p === "1" && present) || (b.dataset.p === "0" && !present)) {
              b.className = `btn btn-sm ${present ? "btn-success" : "btn-danger"}`;
            }
          });
        };
      });

      const submitAtt = document.getElementById("btn-submit-att");
      if (submitAtt) submitAtt.onclick = async () => {
        const key = submitAtt.dataset.key;
        const subject = submitAtt.dataset.subject;
        const records = {};
        document.querySelectorAll("#att-list .att-row").forEach(row => {
          const onLeave = row.dataset.leave === "1";
          records[row.dataset.uid] = {
            name: row.dataset.name,
            present: onLeave || row.classList.contains("present"),
            leave: onLeave
          };
        });
        const data = {
          teacherId: profile.uid,
          teacherName: profile.name,
          department: profile.department,
          slotId: submitAtt.dataset.slot,
          batch: submitAtt.dataset.batch,
          subject,
          date: todayStr(),
          submittedAt: Date.now(),
          lockedAt: Date.now() + 15 * 60 * 1000,
          locked: false,
          records
        };
        await dbSet(`attendanceByDept/${profile.department}/${todayStr()}/${key}`, data);
        setTimeout(async () => {
          try { await dbUpdate(`attendanceByDept/${profile.department}/${todayStr()}/${key}`, { locked: true }); } catch(_){}
        }, 15 * 60 * 1000);
        // Per-subject attendance (leave counts as present)
        const subKey = subject.replace(/[.#$/[\]]/g, "_");
        for (const [uid, rec] of Object.entries(records)) {
          const path = `subjectAtt/${uid}/${subKey}`;
          const prev = await dbGet(path) || { present: 0, total: 0, subject };
          prev.subject = subject;
          prev.total = (prev.total || 0) + 1;
          if (rec.present || rec.leave) prev.present = (prev.present || 0) + 1;
          await dbSet(path, prev);
        }
        await dbSet(`attendanceLog/${todayStr()}/${key}`, {
          teacherId: profile.uid,
          teacherName: profile.name,
          subject,
          department: profile.department,
          slotId: submitAtt.dataset.slot || "",
          ts: Date.now()
        });
        toast("Attendance submitted. Locks in 15 minutes.", "success");
        activeTab = "dashboard";
        renderTeacher();
      };

      // Marks form — Mid 30 + Final 50 + Att 10 (auto) + Presentation 10
      const formMS = document.getElementById("form-marks-select");
      if (formMS) formMS.onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(formMS);
        const batchId = fd.get("batch");
        const subject = fd.get("subject").trim();
        const subKey = subject.replace(/[.#$/[\]]/g, "_");
        const idx = await dbGet(`deptStudents/${profile.department}/${batchId}`) || {};
        const students = [];
        for (const uid of Object.keys(idx)) {
          const u = await dbGet(`users/${uid}`);
          if (!u) continue;
          const sa = await dbGet(`subjectAtt/${uid}/${subKey}`) || {};
          const pct = sa.total ? (sa.present / sa.total) * 100 : 0;
          const attAuto = Math.round((pct / 100) * 10 * 10) / 10; // 0–10
          students.push({ uid, name: u.name, attAuto, attPct: pct });
        }
        students.sort((a,b) => a.name.localeCompare(b.name));
        const area = document.getElementById("marks-form-area");
        if (!students.length) {
          area.innerHTML = `<div class="card"><div class="empty">No students in batch</div></div>`;
          return;
        }
        area.innerHTML = `
          <div class="card">
            <div class="card-title">Enter marks — ${esc(subject)}</div>
            <div class="alert alert-info">Attendance marks are auto-filled from subject attendance % (out of 10).</div>
            <div class="table-wrap"><table>
              <thead><tr><th>Student</th><th>Mid (0–30)</th><th>Final (0–50)</th><th>Att (auto)</th><th>Pres (0–10)</th></tr></thead>
              <tbody id="marks-list">
                ${students.map(s => `
                  <tr data-uid="${esc(s.uid)}" data-name="${esc(s.name)}" data-att="${s.attAuto}">
                    <td>${esc(s.name)}<div style="font-size:0.75rem;color:var(--text-muted);">${s.attPct.toFixed(0)}% att</div></td>
                    <td><input type="number" min="0" max="30" step="0.5" style="width:70px;" data-mid placeholder="0" /></td>
                    <td><input type="number" min="0" max="50" step="0.5" style="width:70px;" data-final placeholder="0" /></td>
                    <td><strong>${s.attAuto}</strong>/10</td>
                    <td><input type="number" min="0" max="10" step="0.5" style="width:70px;" data-pres placeholder="0" /></td>
                  </tr>
                `).join("")}
              </tbody>
            </table></div>
            <button class="btn btn-primary" style="margin-top:1rem;" id="btn-save-marks" data-subject="${esc(subject)}">Save Marks</button>
          </div>
        `;
        document.getElementById("btn-save-marks").onclick = async () => {
          const subj = document.getElementById("btn-save-marks").dataset.subject;
          const lock = await dbGet(`semesterLocks/${profile.department}`);
        if (lock && Object.keys(lock).length) {
          toast("Marks are locked for this department after semester close. Ask Exam Wing to unlock.", "error");
          return;
        }
        let saved = 0;
          for (const row of document.querySelectorAll("#marks-list tr[data-uid]")) {
            const midEl = row.querySelector("[data-mid]");
            const finEl = row.querySelector("[data-final]");
            const presEl = row.querySelector("[data-pres]");
            if (midEl.value === "" && finEl.value === "" && presEl.value === "") continue;
            const mid = Number(midEl.value || 0);
            const fin = Number(finEl.value || 0);
            const pres = Number(presEl.value || 0);
            const att = Number(row.dataset.att || 0);
            const total100 = Math.round((mid + fin + att + pres) * 10) / 10;
            const uid = row.dataset.uid;
            await dbSet(`marks/${uid}/${subj.replace(/[.#$/[\]]/g,"_")}`, {
              subject: subj,
              midterm: mid,
              final: fin,
              attendance: att,
              presentation: pres,
              total100,
              score: total100,
              total: 100,
              grade: letterGrade(total100),
              gp: gradePoint(total100),
              by: profile.uid,
              ts: Date.now()
            });
            // Soft-update student GPA from all subjects
            const allM = await dbGet(`marks/${uid}`) || {};
            const gps = Object.values(allM).map(x => gradePoint(x.total100 ?? x.score ?? 0));
            if (gps.length) {
              const gpa = Math.round((gps.reduce((a,b)=>a+b,0) / gps.length) * 100) / 100;
              const prev = (await dbGet(`users/${uid}`)) || {};
              let termBacks = prev.termBacks || 0;
              // Detect new term-back if GPA drops below 1.7 (only bump if crossing)
              if (gpa < 1.7 && (prev.gpa || 0) >= 1.7) termBacks = termBacks + 1;
              await dbUpdate(`users/${uid}`, { gpa, termBacks });
            }
            saved++;
          }
          toast(saved ? `Saved marks for ${saved} student(s)` : "No marks entered", saved ? "success" : "error");
        };
      };

      const formTann = document.getElementById("form-tann");
      if (formTann) formTann.onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(formTann);
        const sel = formTann.querySelector('[name="subject"]');
        const opt = sel && sel.selectedOptions ? sel.selectedOptions[0] : null;
        const id = pushId("announcements");
        await dbSet(`announcements/${id}`, {
          text: fd.get("text").trim(),
          subject: (fd.get("subject") || "").trim(),
          batch: opt ? (opt.dataset.batch || "") : "",
          department: profile.department,
          by: profile.uid,
          byName: profile.name,
          ts: Date.now()
        });
        toast("Posted for subject", "success");
        renderTeacher();
      };

      document.querySelectorAll("[data-del-ann]").forEach(b => {
        b.onclick = async () => {
          await dbRemove(`announcements/${b.dataset.delAnn}`);
          toast("Deleted", "success");
          renderTeacher();
        };
      });
    }

          }
          const matches = allTeachers.filter(([_,u]) =>
            (u.name||"").toLowerCase().includes(q) || (u.email||"").toLowerCase().includes(q)
          ).slice(0, 8);
          box.innerHTML = matches.map(([uid,u]) => `
            <div style="padding:0.4rem 0.6rem;cursor:pointer;border-radius:6px;background:var(--surface2);margin-bottom:0.25rem;"
              data-tid="${esc(uid)}" data-tname="${esc(u.name)}">

              document.getElementById("tt-teacher-name").value = el.dataset.tname;

          .map(([id,b]) => `<option value="${esc(id)}">${esc(b.name)}</option>`).join("");

                  <span>${esc(r.name)}</span>
                  <span class="badge ${r.present?'badge-success':'badge-danger'}">${r.present?'P':'A'}</span>

              `).join("")}

          </div>

      if (btnReport) btnReport.onclick = async () => {
        const log = await dbGet(`attendanceLog/${todayStr()}`) || {};
        const area = document.getElementById("report-area");
        const rows = Object.values(log).map(l => `
          <tr>
            <td>${esc(l.teacherName)}</td>
            <td>${esc(l.subject)}</td>
            <td>${esc(l.department)}</td>
            <td>${new Date(l.ts).toLocaleTimeString()}</td>
          </tr>
        `).join("") || `<tr><td colspan="4" class="empty">No submissions today</td></tr>`;
        area.innerHTML = `<div class="table-wrap"><table>
          <thead><tr><th>Teacher</th><th>Subject</th><th>Dept</th><th>Time</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
      };
      const btnExp = document.getElementById("btn-export-att");
      if (btnExp) btnExp.onclick = () => exportAttendance(
        document.getElementById("exp-dept").value.trim(),
        document.getElementById("exp-from").value,
        document.getElementById("exp-to").value
      );
      const trim = document.getElementById("btn-trim-log");
      if (trim) trim.onclick = async () => {
        if (!confirm("Delete attendance logs older than 90 days? Today's report and marks stay.")) return;
        const logs = await dbGet("attendanceLog") || {};
        const cut = new Date();
        cut.setDate(cut.getDate() - 90);
        const cutStr = cut.toISOString().slice(0, 10);
        let n = 0;
        for (const date of Object.keys(logs)) {
          if (date < cutStr) { await dbRemove(`attendanceLog/${date}`); n++; }
        }
        toast(n ? "Removed " + n + " old days" : "Nothing older than 90 days", "success");
      };
    }

    async function exportAttendance(dept, from, to) {
      if (!dept || !from || !to) { toast("Department, from, and to are required", "error"); return; }
      const scoped = await dbGet(`attendanceByDept/${dept}`) || {};
      const lines = ["date,subject,teacher,student,status"];
      const use = Object.keys(scoped).length ? scoped : null;
      if (use) {
        Object.entries(use).forEach(([date, day]) => {
          if (date < from || date > to || !day) return;
          Object.values(day).forEach(v => {
            Object.values(v.records || {}).forEach(r => {
              lines.push([date, v.subject, v.teacherName, r.name, r.leave ? "Leave" : (r.present ? "Present" : "Absent")].map(x => `"${String(x||"").replace(/"/g, "'")}"`).join(","));
            });
          });
        });
      } else {
        toast("No department archive yet. New attendance will fill it. Old records stay safe.", "info");
      }
      if (lines.length < 2) { toast("No rows in that range", "error"); return; }
      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `attendance-${dept}-${from}-${to}.csv`;
      a.click();
      toast("CSV downloaded", "success");
    }

    async function renderFinance() {
      clearListeners();
      const fees = await dbGet("fees") || {};
      const students = Object.entries(fees);
      let totalDue = 0, totalPaid = 0, withDues = 0;
      const rows = students.map(([uid, u]) => {
        const rem = (u.total||0) - (u.paid||0);
        totalDue += u.total||0;
        totalPaid += u.paid||0;
        if (rem > 0) withDues++;
        return `
          <tr>
            <td>${esc(u.name)}</td>
            <td>${esc(u.email||"—")}</td>
            <td>${esc(u.department||"—")}</td>
            <td>${(u.total||0).toLocaleString()}</td>
            <td>${(u.paid||0).toLocaleString()}</td>
            <td class="${rem>0?'badge-warning':''}">${rem.toLocaleString()}</td>
            <td>
              <button class="btn btn-sm btn-outline" data-pay="${esc(uid)}" data-name="${esc(u.name)}" data-paid="${u.paid||0}" data-total="${u.total||0}">Update Paid</button>
            </td>
          </tr>
        `;
      }).join("") || `<tr><td colspan="7" class="empty">No fee records yet. Admission invite writes one. Existing students appear after Exam closes a semester or you update paid once.</td></tr>`;

      const bills = await dbGet("bills") || {};
      const pendingBills = Object.entries(bills).filter(([_,b]) => b.status === "pending");
      const billRows = pendingBills.map(([id,b]) => `
        <div class="att-row" style="margin-bottom:0.35rem;">
          <span><strong>${esc(b.byName)}</strong> — ${esc(b.description)} · ${Number(b.amount).toLocaleString()} PKR
            ${b.imageURL ? `<a href="${esc(b.imageURL)}" target="_blank" rel="noopener">Receipt</a>` : ""}
          </span>
          <button class="btn btn-success btn-sm" data-resolve-bill="${esc(id)}">Mark Paid</button>
        </div>
      `).join("") || `<div class="empty" style="padding:0.5rem;">No pending bills</div>`;

      renderShell(`
        <div class="grid-3">
          <div class="stat-card"><div class="stat-value">${totalDue.toLocaleString()}</div><div class="stat-label">Total Fees (PKR)</div></div>
          <div class="stat-card ok"><div class="stat-value">${totalPaid.toLocaleString()}</div><div class="stat-label">Collected</div></div>
          <div class="stat-card ${withDues?'warn':''}"><div class="stat-value">${withDues}</div><div class="stat-label">Students with Dues</div></div>
        </div>
        <div class="card">
          <div class="card-title">${ICONS.bill} Pending Bills (${pendingBills.length})</div>
          ${billRows}
        </div>
        <div class="card">
          <div class="card-title">${ICONS.money} Student Fees Ledger</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Email</th><th>Dept</th><th>Total</th><th>Paid</th><th>Remaining</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>
        </div>
        ${await calendarWidgetHtml()}
      `);

      document.querySelectorAll("[data-pay]").forEach(btn => {
        btn.onclick = async () => {
          const paid = prompt(`Update fees paid for ${btn.dataset.name} (current: ${btn.dataset.paid}):`, btn.dataset.paid);
          if (paid == null) return;
          const val = Number(paid);
          if (isNaN(val) || val < 0) { toast("Invalid amount", "error"); return; }
          await dbUpdate(`users/${btn.dataset.pay}`, { feesPaid: val });
          await dbUpdate(`fees/${btn.dataset.pay}`, { paid: val });
          toast("Updated", "success");
          renderFinance();
        };
      });
      document.querySelectorAll("[data-resolve-bill]").forEach(btn => {
        btn.onclick = async () => {
          await dbRemove(`bills/${btn.dataset.resolveBill}`);
          toast("Bill marked paid & removed", "success");
          renderFinance();
        };
      });
    }

    function bindStudentMgmtHandlers(rerender) {
      const formS = document.getElementById("form-invite-student");
      if (formS) formS.onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(formS);
        const email = fd.get("email").toLowerCase().trim();
        const emailKey = email.replace(/\./g, ",");
        try {
          await dbSet(`pending/${emailKey}`, {
            name: fd.get("name").trim(),
            role: "student",
            department: fd.get("department") || "",
            batch: fd.get("batch") || "",
            feesTotal: Number(fd.get("feesTotal")||0),
            rollNo: (fd.get("rollNo")||"").trim(),
            invitedAt: Date.now()
          });
          toast("Student invitation created", "success");
          rerender();
        } catch (err) {
          console.error(err);
          toast("Failed: " + (err.message || err.code || "permission denied — update database rules"), "error");
        }
      };

      document.querySelectorAll("[data-del-pending]").forEach(b => {
        b.onclick = async () => {
          if (!confirm("Remove this invitation?")) return;
          await dbRemove(`pending/${b.dataset.delPending}`);
          toast("Removed", "success");
          rerender();
        };
      });

      document.querySelectorAll("[data-roll]").forEach(b => {
        b.onclick = async () => {
          const uid = b.dataset.roll;
          const u = await dbGet(`users/${uid}`);
          if (!u) return;
          const roll = prompt("Roll number for " + (u.name || "") + ". Account is not replaced.", u.rollNo || "");
          if (roll == null) return;
          await dbUpdate(`users/${uid}`, { rollNo: roll.trim() });
          await dbUpdate(`fees/${uid}`, { rollNo: roll.trim(), name: u.name || "", email: u.email || "", department: u.department || "", total: u.feesTotal || 0, paid: u.feesPaid || 0 });
          const depts = await dbGet("departments") || {};
          await dbUpdate(`publicBoard/all/${uid}`, {
            name: u.name || "", gpa: Number(u.gpa || 0), rollNo: roll.trim(),
            deptCode: (depts[u.department] && depts[u.department].code) || u.department || ""
          });
          toast("Roll number saved", "success");
          rerender();
        };
      });

      document.querySelectorAll("[data-del-student]").forEach(b => {
        b.onclick = async () => {
          if (!confirm("Permanently delete this student account?")) return;
          const uid = b.dataset.delStudent;
          try {
            const u = await dbGet(`users/${uid}`);
            if (u) {
              const ek = (u.email||"").replace(/\./g, ",");
              await dbRemove(`users/${uid}`);
              if (ek) await dbRemove(`emails/${ek}`);
              if (u.department && u.batch) await dbRemove(`deptStudents/${u.department}/${u.batch}/${uid}`);
              await dbRemove(`marks/${uid}`);
            }
            toast("Student deleted", "success");
            rerender();
          } catch (err) {
            toast("Delete failed: " + (err.message || err.code), "error");
          }
        };
      });

      const formB = document.getElementById("form-batch-wing");
      if (formB) formB.onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(formB);
        try {
          const id = pushId("batches");
          await dbSet(`batches/${id}`, {
            name: fd.get("name").trim(),
            department: fd.get("department"),
            year: fd.get("year").trim(),
            createdAt: Date.now()
          });
          toast("Batch added", "success");
          rerender();
        } catch (err) {
          toast("Failed: " + (err.message || err.code), "error");
        }
      };

      document.querySelectorAll("[data-del-batch]").forEach(b => {
        b.onclick = async () => {
          if (!confirm("Delete this batch and its student index?")) return;
          const id = b.dataset.delBatch;
          try {
            const batch = await dbGet(`batches/${id}`);
            if (batch?.department) await dbRemove(`deptStudents/${batch.department}/${id}`);
            await dbRemove(`batches/${id}`);
            toast("Batch deleted", "success");
            rerender();
          } catch (err) {
            toast("Failed: " + (err.message || err.code), "error");
          }
        };
      });
    }

    async function renderExam() {
      clearListeners();
      const tabs = [
        { id: "dashboard", label: "Marks Ledger" },
        { id: "students", label: "Students & Batches" }
      ];
      if (!tabs.find(t => t.id === activeTab)) activeTab = "dashboard";

      let body = "";
      if (activeTab === "students") {
        body = await studentMgmtHtml();
      } else {
        const depts = await dbGet("departments") || {};
        const batches = await dbGet("batches") || {};
        const deptOpts = Object.entries(depts).map(([id,d]) => `<option value="${esc(id)}">${esc(d.name)}</option>`).join("");
        body = `
          <div class="card">
            <div class="card-title">Marks Ledger</div>
            <div class="form-row">
              <div class="form-group"><label>Department</label><select id="exam-dept"><option value="">Select…</option>${deptOpts}</select></div>
              <div class="form-group"><label>Batch</label><select id="exam-batch"><option value="">Select dept first</option></select></div>
            </div>
            <button class="btn btn-primary" id="btn-exam-load">Load Ledger</button>
            <button class="btn btn-outline" id="btn-exam-print" style="margin-left:0.5rem;">Print</button>
            <button class="btn btn-outline" id="btn-close-sem" style="margin-left:0.5rem;">Close semester</button>
            <button class="btn btn-outline" id="btn-unlock-sem" style="margin-left:0.5rem;">Unlock marks</button>
            <div id="exam-ledger" style="margin-top:1rem;"></div>
          </div>
        `;
      }

      renderShell(`${tabsHtml(tabs, activeTab)}${body}`);
      bindTabs(renderExam);

      if (activeTab === "students") {
        bindStudentMgmtHandlers(renderExam);
      } else {
        const batches = await dbGet("batches") || {};
        const examDept = document.getElementById("exam-dept");
        if (examDept) examDept.onchange = async () => {
          const dept = examDept.value;
          const opts = Object.entries(batches)
            .filter(([_,b]) => b.department === dept)
            .map(([id,b]) => `<option value="${esc(id)}">${esc(b.name)}</option>`).join("");
          document.getElementById("exam-batch").innerHTML = `<option value="">Select…</option>${opts}`;
        };
        const btnLoad = document.getElementById("btn-exam-load");
        if (btnLoad) btnLoad.onclick = async () => {
          const dept = document.getElementById("exam-dept").value;
          const batch = document.getElementById("exam-batch").value;
          if (!dept || !batch) { toast("Select department and batch", "error"); return; }
          const idx = await dbGet(`deptStudents/${dept}/${batch}`) || {};
          const students = [];
          for (const uid of Object.keys(idx)) {
            const u = await dbGet(`users/${uid}`);
            const marks = await dbGet(`marks/${uid}`) || {};
            if (u) students.push({ uid, name: u.name, email: u.email, gpa: u.gpa, marks });
          }
          students.sort((a,b) => a.name.localeCompare(b.name));
          const subjects = new Set();
          students.forEach(s => Object.values(s.marks).forEach(m => subjects.add(m.subject||"")));
          const subList = [...subjects].filter(Boolean).sort();
          let thead = `<th>Name</th><th>Email</th>` + subList.map(s => `<th>${esc(s)}</th>`).join("") + `<th>GPA</th>`;
          let tbody = students.map(s => {
            const cells = subList.map(sub => {
              const m = Object.values(s.marks).find(x => x.subject === sub);
              return `<td>${m ? m.score + "/" + (m.total||100) : "—"}</td>`;
            }).join("");
            return `<tr><td>${esc(s.name)}</td><td>${esc(s.email)}</td>${cells}<td>${s.gpa ? s.gpa.toFixed(2) : "—"}</td></tr>`;
          }).join("") || `<tr><td colspan="${subList.length+3}" class="empty">No students</td></tr>`;
          document.getElementById("exam-ledger").innerHTML = `
            <div class="table-wrap"><table>
              <thead><tr>${thead}</tr></thead>
              <tbody>${tbody}</tbody>
            </table></div>
          `;
        };
        const btnPrint = document.getElementById("btn-exam-print");
        if (btnPrint) btnPrint.onclick = () => window.print();
        const btnClose = document.getElementById("btn-close-sem");
        if (btnClose) btnClose.onclick = async () => {
          const dept = document.getElementById("exam-dept").value;
          if (!dept) { toast("Select a department", "error"); return; }
          const sem = prompt("Semester name to close (once). Example: Fall 2026");
          if (!sem) return;
          const semKey = sem.trim().replace(/[.#$/[\]]/g, "_");
          if (!confirm("Close " + sem + " for this department? GPA is recalculated. A term back is added only if GPA is below 1.7 and this semester was not closed before. Accounts are not deleted.")) return;
          const users = await dbGet("users") || {};
          const depts = await dbGet("departments") || {};
          let n = 0;
          for (const [uid, u] of Object.entries(users)) {
            if (u.department !== dept) continue;
            if (u.role !== "student" && !getRolesList(u).includes("student")) continue;
            const marks = await dbGet(`marks/${uid}`) || {};
            const gps = Object.values(marks).map(x => gradePoint(x.total100 ?? x.score ?? 0));
            const gpa = gps.length ? Math.round((gps.reduce((a, b) => a + b, 0) / gps.length) * 100) / 100 : Number(u.gpa || 0);
            const closed = (u.closedSemesters && u.closedSemesters[semKey]) || false;
            let termBacks = u.termBacks || 0;
            if (!closed && gpa > 0 && gpa < 1.7) termBacks += 1;
            await dbUpdate(`users/${uid}`, { gpa, termBacks, ["closedSemesters/" + semKey]: true, marksLocked: semKey });
            await dbSet(`publicBoard/all/${uid}`, {
              name: u.name || "",
              gpa,
              rollNo: u.rollNo || "",
              deptCode: (depts[u.department] && depts[u.department].code) || u.department || ""
            });
            await dbSet(`fees/${uid}`, {
              name: u.name || "", email: u.email || "", department: u.department || "",
              total: u.feesTotal || 0, paid: u.feesPaid || 0, rollNo: u.rollNo || ""
            });
            n++;
          }
          await dbSet(`semesterLocks/${dept}/${semKey}`, { by: profile.uid, ts: Date.now(), title: sem });
          toast("Semester closed for " + n + " student(s). Marks for this department are locked.", "success");
        };
        const btnUnlock = document.getElementById("btn-unlock-sem");
        if (btnUnlock) btnUnlock.onclick = async () => {
          const dept = document.getElementById("exam-dept").value;
          if (!dept) { toast("Select a department", "error"); return; }
          if (!confirm("Unlock marks for this department? Student accounts and marks stay.")) return;
          await dbRemove(`semesterLocks/${dept}`);
          toast("Marks unlocked. Nothing was deleted.", "success");
        };
      }
    }

    async function renderPVC() {
      clearListeners();
      const log = await dbGet(`attendanceLog/${todayStr()}`) || {};
      const depts = await dbGet("departments") || {};
      const today = dayName();
      const now = nowMinutes();
      const takenKeys = new Set();
      const filteredLog = [];
      for (const [k, l] of Object.entries(log)) {
        if (l.teacherId && await isOnApprovedLeave(l.teacherId)) continue;
        filteredLog.push(l);
        if (l.teacherId && l.subject) takenKeys.add(`${l.teacherId}|${l.subject}|${l.department||""}`);
        if (l.slotId) takenKeys.add(`slot:${l.department}_${l.slotId}`);
      }
      // Also match by attendance keys stored as dept_slot_date
      for (const k of Object.keys(log)) {
        takenKeys.add(`key:${k}`);
      }

      const rows = filteredLog.sort((a,b) => (b.ts||0)-(a.ts||0)).map(l => `
        <tr>
          <td>${esc(l.teacherName)}</td>
          <td>${esc(l.subject)}</td>
          <td>${esc(l.department)}</td>
          <td><span class="badge badge-success">Taken</span> ${new Date(l.ts).toLocaleTimeString()}</td>
        </tr>
      `).join("");

      // Missed: scheduled class whose end time has passed, teacher not on leave, no attendance submitted
      const missedRows = [];
      let scheduled = 0;
      for (const deptId of Object.keys(depts)) {
        const tt = await loadTimetable(deptId);
        const daySlots = tt[today] || {};
        for (const [sid, s] of Object.entries(daySlots)) {
          scheduled++;
          const end = timeToMin(s.end);
          if (now < end) continue; // class not finished — don't report yet
          if (s.teacherId && await isOnApprovedLeave(s.teacherId)) continue;
          const attKey = `${deptId}_${sid}_${todayStr()}`;
          const logHit = Object.values(log).some(l =>
            (l.slotId === sid && l.department === deptId) ||
            (l.teacherId === s.teacherId && l.subject === s.subject && (l.department === deptId || !l.department))
          );
          const attExists = await dbGet(`attendance/${attKey}`);
          if (logHit || attExists) continue;
          missedRows.push(`
            <tr>
              <td>${esc(s.teacherName||s.teacherId)}</td>
              <td>${esc(s.subject)}</td>
              <td>${esc(depts[deptId]?.name || deptId)}</td>
              <td><span class="badge badge-danger">Not taken</span> ${fmtTime(s.start)}–${fmtTime(s.end)}</td>
            </tr>`);
        }
      }

      const allRows = (rows + missedRows.join("")) || `<tr><td colspan="4" class="empty">No scheduled classes to report today (teachers with no class are not listed)</td></tr>`;

      const bills = await dbGet("bills") || {};
      const pendingBills = Object.entries(bills).filter(([_,b]) => b.status === "pending");
      const billHtml = pendingBills.map(([id,b]) => `
        <div class="att-row" style="margin-bottom:0.35rem;">
          <span><strong>${esc(b.byName)}</strong> — ${esc(b.description)} · ${Number(b.amount).toLocaleString()} PKR
            ${b.imageURL ? `<a href="${esc(b.imageURL)}" target="_blank">Receipt</a>` : ""}
          </span>
        </div>
      `).join("") || `<div class="empty" style="padding:0.5rem;">No pending bills</div>`;

      const leaves = await dbGet("leaves") || {};
      const pendingLeaves = Object.entries(leaves).filter(([_,l]) => l.status === "pending");
      const leaveHtml = pendingLeaves.map(([id,l]) => `
        <div class="card" style="margin-bottom:0.5rem;">
          <div><strong>${esc(l.byName)}</strong> (${esc(l.role)}) · ${esc(l.type)} leave</div>
          <div style="font-size:0.85rem;color:var(--text-muted);">${esc(l.from)} → ${esc(l.to)} — ${esc(l.reason)}</div>
          ${l.proofURL ? `<a href="${esc(l.proofURL)}" target="_blank" style="font-size:0.85rem;">View proof</a>` : ""}
          <div style="margin-top:0.5rem;display:flex;gap:0.4rem;">
            <button class="btn btn-success btn-sm" data-approve-leave="${esc(id)}">Approve</button>
            <button class="btn btn-danger btn-sm" data-decline-leave="${esc(id)}">Decline</button>
          </div>
        </div>
      `).join("") || `<div class="empty" style="padding:0.5rem;">No pending special leaves</div>`;

      renderShell(`
        <div class="grid-3">
          <div class="stat-card ok"><div class="stat-value">${filteredLog.length}</div><div class="stat-label">Classes Marked Today</div></div>
          <div class="stat-card ${missedRows.length?'danger':''}"><div class="stat-value">${missedRows.length}</div><div class="stat-label">Missed (not taken)</div></div>
          <div class="stat-card ${pendingLeaves.length?'warn':''}"><div class="stat-value">${pendingLeaves.length}</div><div class="stat-label">Leave requests</div></div>
        </div>
        <div class="card">
          <div class="card-title">${ICONS.check} Class Attendance Today — ${todayStr()}</div>
          <div class="alert alert-info">Only teachers with a scheduled class today appear. Missed = class ended without attendance. Leave excluded. Teachers with no class today are not listed.</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Teacher</th><th>Subject</th><th>Department</th><th>Status</th></tr></thead>
            <tbody>${allRows}</tbody>
          </table></div>
        </div>
        <div class="widget-grid">
          <div class="card">
            <div class="card-title">${ICONS.leave} Special Leave Requests</div>
            ${leaveHtml}
          </div>
          <div class="card">
            <div class="card-title">${ICONS.bill} Pending Bills</div>
            ${billHtml}
          </div>
        </div>
        ${await calendarWidgetHtml()}
      `);

      document.querySelectorAll("[data-approve-leave]").forEach(btn => {
        btn.onclick = async () => {
          await dbUpdate(`leaves/${btn.dataset.approveLeave}`, { status: "approved", decidedBy: profile.uid, decidedAt: Date.now() });
          toast("Leave approved", "success");
          renderPVC();
        };
      });
      document.querySelectorAll("[data-decline-leave]").forEach(btn => {
        btn.onclick = async () => {
          await dbUpdate(`leaves/${btn.dataset.declineLeave}`, { status: "declined", decidedBy: profile.uid, decidedAt: Date.now() });
          toast("Leave declined", "success");
          renderPVC();
        };
      });
    }

      const depts = await dbGet("departments") || {};
      const tt = await loadTimetable(profile.department);
      const today = dayName();
      const log = await dbGet(`attendanceLog/${todayStr()}`) || {};
      const slots = Object.entries(tt[today] || {});
      const now = nowMinutes();
      const rows = [];
      for (const [sid, s] of slots) {
        if (s.teacherId && await isOnApprovedLeave(s.teacherId)) continue;
        const taken = Object.values(log).some(l => l.slotId === sid || (l.teacherId === s.teacherId && l.subject === s.subject));
        const ended = now >= timeToMin(s.end);
        const status = taken ? "Taken" : (ended ? "Missed" : "Upcoming");
        rows.push(`<tr>
          <td>${esc(s.teacherName||"")}</td>
          <td>${esc(s.subject)}</td>
          <td>${fmtTime(s.start)}–${fmtTime(s.end)}</td>
          <td><span class="badge ${taken ? "badge-success" : ended ? "badge-danger" : "badge-info"}">${status}</span></td>
        </tr>`);
      }
      renderShell(`
        <div class="card">
          <div class="card-title">HOD · ${esc(depts[profile.department]?.name || profile.department)} · ${today}</div>
          <div class="alert alert-info">Teachers with no class today are not listed. Missed means the class ended without attendance.</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Teacher</th><th>Subject</th><th>Time</th><th>Attendance</th></tr></thead>
            <tbody>${rows.join("") || `<tr><td colspan="4" class="empty">No classes scheduled today</td></tr>`}</tbody>
          </table></div>
        </div>
        <p style="font-size:0.85rem;color:var(--text-muted);">Switch back to Teacher in the header for attendance, marks, and your profile.</p>
        <div class="card">
          <div class="card-title">Download attendance</div>
          <div class="form-row">
            <div class="form-group"><label>From</label><input type="date" id="hod-from" /></div>
            <div class="form-group"><label>To</label><input type="date" id="hod-to" value="${todayStr()}" /></div>
          </div>
          <button class="btn btn-outline" id="hod-export">Download CSV</button>
        </div>
      `);
      const hx = document.getElementById("hod-export");
      if (hx) hx.onclick = () => exportAttendance(profile.department, document.getElementById("hod-from").value, document.getElementById("hod-to").value);
    }

    function routeToRole() {
      activeTab = "dashboard";
      const r = activeRole();
      switch (r) {
        case "admin": return renderAdmin();
        case "student": return renderStudent();
        case "teacher": return renderTeacher();
        case "clerk": return renderClerk();
        case "finance": return renderFinance();
        case "exam": return renderExam();
        case "admission": return renderAdmission();
        case "hod": return renderHOD();
        case "pvc": return renderPVC();
        default:
          renderShell(`<div class="card"><div class="alert alert-danger">Unknown role: ${esc(r)}. Contact admin.</div></div>`);
      }
    }

    // ─── Auth State ─────────────────────────────────────────────
    // Wait for the saved sign-in before showing the login card.
    document.getElementById("app").innerHTML = `<div class="login-wrap"><div class="spinner"></div></div>`;

    onAuthStateChanged(auth, async (user) => {
      clearListeners();
      currentUser = user;
      if (!user) {
        profile = null;
        renderLogin();
        return;
      }
      document.getElementById("app").innerHTML = `<div class="login-wrap"><div class="spinner"></div></div>`;
      try {
        profile = await ensureProfile(user);
        if (!profile) {
          await signOut(auth);
          toast("Access denied. Your email is not registered. Contact the administrator.", "error");
          renderLogin();
          return;
        }
        // Normalize legacy single-role profiles
        const list = getRolesList(profile);
        if (!profile.roles || !Object.keys(profile.roles || {}).length) {
          profile.roles = rolesToMap(list.length ? list : [profile.role].filter(Boolean));
          profile.activeRole = profile.activeRole || profile.role;
          try { await dbUpdate(`users/${profile.uid}`, { roles: profile.roles, activeRole: profile.activeRole }); } catch (_) {}
        }
        // Term-back dropout check
        if (hasRole("student") && (profile.termBacks || 0) >= 3) {
          await dbRemove(`users/${profile.uid}`);
          const ek = profile.email.replace(/\./g, ",");
          await dbRemove(`emails/${ek}`);
          if (profile.department && profile.batch) {
            await dbRemove(`deptStudents/${profile.department}/${profile.batch}/${profile.uid}`);
          }
          await signOut(auth);
          toast("Account removed due to three term backs.", "error");
          return;
        }
        await idbSet("profile", profile);
        renderLanding();
        if (hasRole("student") && !hasRole("teacher") && !hasRole("admin")) studentSyncCycle();
      } catch (e) {
        console.error(e);
        toast("Error loading profile: " + e.message, "error");
        // Try offline cache
        const cached = await idbGet("profile");
        if (cached) {
          profile = cached;
          routeToRole();
          toast("Working offline from cache", "info");
        } else {
          renderLogin();
        }
      }
    });

    // ─── Service Worker ─────────────────────────────────────────
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((err) => {
        console.warn("SW registration failed:", err);
      });
    }

    // Init IDB
    onValue(ref(db, ".info/serverTimeOffset"), (snap) => {
      clockOffset = Number(snap.val() || 0);
    });
    window.addEventListener("online", () => flushOutbox());
    openIDB().then(() => flushOutbox()).catch(() => {});
  </script>
</body>
</html>
