<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3A2E22" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SALU LMS" />
  <meta name="description" content="SALU LMS - Shah Abdul Latif University Learning Management System" />
  <title>SALU LMS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icon-180.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    :root {
      --bg: #F8F3E6;
      --surface: #F8F3E6;
      --surface2: #ECE4D0;
      --surface3: #E5DCC8;
      --primary: #3A2E22;
      --primary-mid: #6B4F3A;
      --primary-light: #B9975B;
      --accent: #7A3B2E;
      --accent-hover: #5C2D22;
      --accent-soft: #ECE4D0;
      --success: #5F6F4B;
      --success-bg: #E8EDE4;
      --warning: #9A7B3F;
      --warning-bg: #F5EDE0;
      --danger: #7A3B2E;
      --danger-bg: #F5E8E4;
      --text: #4A4034;
      --text-muted: #6E6252;
      --border: #DCD0B8;
      --radius: 6px;
      --radius-sm: 5px;
      --shadow: 0 2px 10px rgba(94,72,40,.10);
      --shadow-md: 0 4px 18px rgba(94,72,40,.14);
      --shadow-lg: 0 10px 26px rgba(94,72,40,.18);
      --font: Georgia, "Times New Roman", serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      font-size: 15px;
    }
    a { color: var(--accent); text-decoration: none; transition: color 0.15s var(--ease); }
    a:hover { color: var(--accent-hover); }

    button, .btn {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.55rem 1.15rem;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease), background 0.15s var(--ease), border-color 0.15s var(--ease);
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary {
      background: var(--primary-mid);
      color: #EFE9DA;
      box-shadow: 0 2px 8px rgba(58,46,34,.22);
    }
    .btn-primary:hover { background: #7A5A42; box-shadow: var(--shadow-md); filter: brightness(1.05); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; border-radius: 8px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

    input, select, textarea {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.6rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      width: 100%;
      transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3.5px rgba(185,151,91,0.25);
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      letter-spacing: 0.01em;
    }
    .form-group { margin-bottom: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

    /* Layout */
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    .header {
      background: rgba(248,243,230,0.94);
      color: var(--text);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 8px rgba(94,72,40,.06);
    }
    .header-brand {
      display: flex; align-items: center; gap: 0.7rem;
      font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em;
      color: var(--primary);
    }
    .header-brand img {
      width: 34px; height: 34px; border-radius: 9px;
      object-fit: cover; background: #fff;
      box-shadow: 0 0 0 2px var(--border);
    }
    .header-actions { display: flex; align-items: center; gap: 0.65rem; }
    .user-chip {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--surface2);
      padding: 0.25rem 0.7rem 0.25rem 0.25rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .user-chip img {
      width: 28px; height: 28px; border-radius: 50%;
      object-fit: cover; background: #fff;
    }
    .role-badge {
      font-size: 0.65rem;
      background: var(--accent-soft);
      color: var(--accent-hover);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 700;
    }
    .header .btn-outline {
      color: var(--text-muted) !important;
      border-color: var(--border) !important;
      background: var(--surface) !important;
    }
    .header .btn-outline:hover {
      border-color: var(--accent) !important;
      color: var(--accent) !important;
      background: var(--accent-soft) !important;
    }
    .widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .widget-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.85; vertical-align: -3px; margin-right: 0.35rem; }
    .cal-item { padding: 0.65rem 0.85rem; border-radius: var(--radius-sm); background: var(--surface2); margin-bottom: 0.4rem; font-size: 0.875rem; }
    .cal-item .cal-date { font-weight: 700; color: var(--primary); font-size: 0.75rem; }
    .cal-item.holiday { border-left: 3px solid var(--warning); }
    .cal-item.event { border-left: 3px solid var(--accent); }
    .main {
      flex: 1;
      padding: 1.5rem 0.75rem 2rem;
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
      animation: fadeUp 0.35s var(--ease);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .footer {
      text-align: center;
      padding: 1.1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    /* Login */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(ellipse 70% 50% at 10% 20%, rgba(185,151,91,0.15), transparent),
        radial-gradient(ellipse 60% 40% at 90% 80%, rgba(95,111,75,0.1), transparent),
        linear-gradient(165deg, #F8F3E6 0%, #ECE4D0 50%, #F5EDE0 100%);
    }
    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2.75rem 2.25rem;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      text-align: center;
      animation: fadeUp 0.45s var(--ease);
    }
    .login-card h1 {
      font-size: 1.55rem;
      color: var(--primary);
      margin-bottom: 0.3rem;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    .login-card p { color: var(--text-muted); margin-bottom: 1.75rem; font-size: 0.9rem; }
    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff;
      border: 1.5px solid var(--border);
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      width: 100%;
      justify-content: center;
      transition: box-shadow 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.15s var(--ease);
    }
    .google-btn:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
    .google-btn:active { transform: scale(0.98); }
    .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* Cards & grids */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.35rem;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      transition: box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    .card:hover { box-shadow: var(--shadow-md); border-color: var(--primary-light); }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      letter-spacing: -0.02em;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.9rem; }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.25rem 1rem;
      box-shadow: var(--shadow);
      text-align: center;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--accent);
      opacity: 0.7;
    }
    .stat-card.ok::before { background: var(--success); }
    .stat-card.warn::before { background: var(--warning); }
    .stat-card.danger::before { background: var(--danger); }
    .stat-value {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Alerts */
    .alert {
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-weight: 500;
      line-height: 1.45;
    }
    .alert-warning { background: var(--warning-bg); color: #92400e; border: 1px solid #fde68a; }
    .alert-danger { background: var(--danger-bg); color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: var(--success-bg); color: #065f46; border: 1px solid #a7f3d0; }
    .alert-info { background: var(--accent-soft); color: #1e40af; border: 1px solid #bfdbfe; }

    /* Tables */
    .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { padding: 0.7rem 0.85rem; text-align: left; border-bottom: 1px solid var(--border); }
    th {
      background: var(--surface2);
      font-weight: 600;
      color: var(--primary);
      white-space: nowrap;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-info { background: var(--accent-soft); color: var(--accent); }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      margin-bottom: 1.35rem;
      background: var(--surface2);
      padding: 0.3rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .tab {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      transition: all 0.18s var(--ease);
      letter-spacing: -0.01em;
    }
    .tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 3px rgba(15,39,68,0.08);
    }
    .tab:hover:not(.active) { color: var(--primary); background: rgba(255,255,255,0.5); }

    /* Profile */
    .avatar {
      width: 76px; height: 76px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface2);
      border: 3px solid var(--surface);
      box-shadow: 0 0 0 2px var(--border);
    }
    .avatar-sm {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface2);
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.45);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 1rem;
      animation: fadeUp 0.2s var(--ease);
    }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.6rem;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    .modal h2 { font-size: 1.15rem; color: var(--primary); margin-bottom: 1rem; letter-spacing: -0.02em; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; }

    /* Empty */
    .empty {
      text-align: center;
      padding: 2.75rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Loading */
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      margin: 2.5rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    #toast-container {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      z-index: 300; display: flex; flex-direction: column; gap: 0.5rem;
      pointer-events: none;
    }
    .toast {
      background: var(--primary);
      color: #fff;
      padding: 0.75rem 1.2rem;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      font-size: 0.875rem;
      font-weight: 500;
      animation: toastIn 0.3s var(--ease);
      max-width: 340px;
      pointer-events: auto;
    }
    .toast.error { background: var(--danger); }
    .toast.success { background: var(--success); }
    @keyframes toastIn {
      from { transform: translateY(16px) scale(0.96); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    /* Timetable */
    .tt-grid { display: grid; gap: 0.55rem; }
    .tt-slot {
      background: var(--accent-soft);
      border-left: 3.5px solid var(--accent);
      padding: 0.75rem 1rem;
      border-radius: 0 10px 10px 0;
      font-size: 0.875rem;
      transition: transform 0.15s var(--ease);
    }
    .tt-slot:hover { transform: translateX(2px); }
    .tt-slot.current {
      background: var(--success-bg);
      border-left-color: var(--success);
      box-shadow: 0 0 0 1px #a7f3d0;
    }
    .tt-slot.upcoming {
      background: var(--warning-bg);
      border-left-color: var(--warning);
    }
    .tt-time { font-weight: 700; color: var(--primary); font-size: 0.78rem; letter-spacing: 0.01em; }
    .tt-subject { font-weight: 600; margin-top: 0.1rem; }
    .tt-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.15rem; }

    /* Attendance */
    .att-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .att-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 0.85rem;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      gap: 0.5rem;
      transition: background 0.15s var(--ease);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .att-row.present { background: var(--success-bg); }
    .att-row.absent { background: var(--danger-bg); }
    .att-toggle { display: flex; gap: 0.3rem; }
    .att-toggle button { min-width: 68px; }

    /* Announcements */
    .ann-item {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }
    .ann-item:last-child { border-bottom: none; }
    .ann-item:first-child { padding-top: 0; }
    .ann-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      font-weight: 500;
    }
    .ann-body { font-size: 0.9rem; line-height: 1.5; }

    /* Social */
    .social-links { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .social-links a {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; color: var(--primary);
      transition: background 0.15s var(--ease), color 0.15s var(--ease);
    }
    .social-links a:hover { background: var(--accent); color: #fff; }

    /* Header logout button override */
    .header .btn-outline {
      color: rgba(255,255,255,0.9);
      border-color: rgba(255,255,255,0.25);
      background: transparent;
      font-size: 0.8rem;
      padding: 0.4rem 0.9rem;
    }
    .header .btn-outline:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.4);
      color: #fff;
    }

    @media (max-width: 640px) {
      .header { padding: 0.55rem 0.75rem; }
      .main { padding: 1.1rem 0.5rem 1.75rem; }
      .user-chip span:not(.role-badge) { display: none; }
      .stat-value { font-size: 1.4rem; }
      .tabs { gap: 0.2rem; }
      .tab { padding: 0.45rem 0.7rem; font-size: 0.8rem; }
    }

    @media print {
      .header, .tabs, .btn, .footer, #toast-container { display: none !important; }
      .main { padding: 0; max-width: none; animation: none; }
      .card { box-shadow: none; border: 1px solid #ccc; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div class="login-wrap">
      <div class="login-card">
        <h1>SALU LMS</h1>
        <p>Shah Abdul Latif University<br/>Ghotki Campus</p>
        <p style="margin-top:1rem;font-size:0.85rem;color:var(--text-muted);">Opening sign-in…</p>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>

  <script type="module">
    // ─── Firebase ───────────────────────────────────────────────
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      setPersistence, browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
    import {
      getDatabase, ref, set, get, update, remove, push, onValue, off,
      query, orderByChild, equalTo, limitToLast, goOffline, goOnline
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCHC23BiSkd4dIm8iFIfmTRjZg1RY1dDEU",
      authDomain: "lms-salu-ghotki.firebaseapp.com",
      projectId: "lms-salu-ghotki",

    // ─── IndexedDB (offline cache) ──────────────────────────────
    const IDB_NAME = "salu-lms";

    let idb = null;

    function openIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("cache")) {
            db.createObjectStore("cache", { keyPath: "key" });
          }
        };
        req.onsuccess = () => { idb = req.result; resolve(idb); };
        req.onerror = () => reject(req.error);
      });
    }

    async function idbSet(key, value) {
      if (!idb) await openIDB();
      return new Promise((resolve, reject) => {
        const tx = idb.transaction("cache", "readwrite");
        tx.objectStore("cache").put({ key, value, ts: Date.now() });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbGet(key) {
      if (!idb) await openIDB();
      return new Promise((resolve, reject) => {
        const tx = idb.transaction("cache", "readonly");
        const req = tx.objectStore("cache").get(key);
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
        req.onerror = () => reject(req.error);
      });
    }

    function fmtTime(t) {
      if (!t) return "";
      const [h, m] = t.split(":").map(Number);
      const ampm = h >= 12 ? "PM" : "AM";
      const h12 = h % 12 || 12;
      return `${h12}:${String(m).padStart(2,"0")} ${ampm}`;

    let clockOffset = 0;

    function todayStr() {

    }
    function dayName() {
      return DAYS[trustedNow().getDay() === 0 ? 6 : trustedNow().getDay() - 1] || "Monday";
    }
    function nowMinutes() {
      const d = trustedNow();
      return d.getHours() * 60 + d.getMinutes();
    }

    function timeToMin(t) {

    }

    function clearListeners() {
      listeners.forEach(unsub => { try { unsub(); } catch(_){} });
      listeners = [];
    }

    function listen(path, cb) {
      const r = ref(db, path);
      const unsub = onValue(r, snap => cb(snap.val()));
      listeners.push(() => off(r));
      return unsub;
    }

    async function dbGet(path) {
      try {
        const snap = await get(ref(db, path));
        const val = snap.val();
        if (val != null) idbSet(path, val).catch(() => {});
        return val;
      } catch (e) {
        console.warn("dbGet failed, trying cache", path, e);
        return idbGet(path);
      }
    }

    async function queueWrite(op, path, data) {
      const q = (await idbGet("outbox")) || [];
      q.push({ op, path, data, ts: Date.now() });
      await idbSet("outbox", q);
      toast("Saved on this phone. It will sync when online.", "info");
    }

    async function flushOutbox() {
      if (!navigator.onLine) return;
      const q = (await idbGet("outbox")) || [];
      if (!q.length) return;
      const left = [];
      for (const item of q) {
        try {
          if (item.op === "set") await set(ref(db, item.path), item.data);
          else if (item.op === "update") await update(ref(db, item.path), item.data);
          else if (item.op === "remove") await remove(ref(db, item.path));
        } catch (_) {
          left.push(item);
        }
      }
      await idbSet("outbox", left);
      if (left.length < q.length) toast("Offline changes synced", "success");
    }

    async function dbSet(path, data) {
      await idbSet(path, data);
      if (!navigator.onLine) return queueWrite("set", path, data);
      try { await set(ref(db, path), data); }
      catch (e) { await queueWrite("set", path, data); }
    }

    async function dbUpdate(path, data) {
      if (!navigator.onLine) return queueWrite("update", path, data);
      try { await update(ref(db, path), data); }
      catch (e) { await queueWrite("update", path, data); }
    }

    async function dbRemove(path) {
      if (!navigator.onLine) return queueWrite("remove", path);
      try { await remove(ref(db, path)); }
      catch (e) { await queueWrite("remove", path); }
    }

        goOffline(db);
      }

    async function ensureProfile(user) {
      const email = user.email.toLowerCase();
      // Admin hard-coded
      if (email === ADMIN_EMAIL.toLowerCase()) {
        const existing = await dbGet(`users/${user.uid}`);
        const p = {
          uid: user.uid,
          email,
          name: (existing && existing.name) || user.displayName || "Administrator",
          photoURL: user.photoURL || (existing && existing.photoURL) || "",
          role: "admin",
          activeRole: "admin",
          roles: { ...(existing && existing.roles) || {}, admin: true },
          department: (existing && existing.department) || "",
          createdAt: (existing && existing.createdAt) || Date.now()
        };
        await dbSet(`users/${user.uid}`, p);
        await dbSet(`emails/${email.replace(/\./g, ",")}`, user.uid);
        return p;
      }

      // Look up by email mapping
      const emailKey = email.replace(/\./g, ",");
      const uidMap = await dbGet(`emails/${emailKey}`);
      if (uidMap) {
        // Already linked
        let p = await dbGet(`users/${uidMap}`);
        if (p) {
          // Update uid if needed (first login after admin created profile with placeholder)
          if (uidMap !== user.uid) {
            p.uid = user.uid;
            p.photoURL = p.photoURL || user.photoURL || "";
            await dbSet(`users/${user.uid}`, p);
            await dbRemove(`users/${uidMap}`);
            await dbSet(`emails/${emailKey}`, user.uid);
          } else {
            // Refresh photo if empty
            if (!p.photoURL && user.photoURL) {
              p.photoURL = user.photoURL;
              await dbUpdate(`users/${user.uid}`, { photoURL: user.photoURL });
            }
          }
          return p;
        }
      }

      // Check if admin pre-created a pending profile under pending/{emailKey}
      const pending = await dbGet(`pending/${emailKey}`);
      if (pending) {
        let roleList = [];
        if (pending.roles && typeof pending.roles === "object") {
          roleList = Object.keys(pending.roles).filter(k => pending.roles[k]);
        } else if (Array.isArray(pending.roles)) {
          roleList = pending.roles;
        } else if (pending.role) {
          roleList = [pending.role];
        }
        if (!roleList.length) roleList = ["student"];
        const primary = roleList[0];
        const p = {
          uid: user.uid,
          email,
          name: pending.name || user.displayName || "User",
          photoURL: user.photoURL || "",
          role: primary,
          activeRole: primary,
          roles: rolesToMap(roleList),
          department: pending.department || "",
          batch: pending.batch || "",
          rollNo: pending.rollNo || "",
          bio: "",
          researchHistory: "",
          website: "",
          social: {},
          attendancePct: 100,
          gpa: 0,
          termBacks: 0,
          feesTotal: pending.feesTotal || 0,
          feesPaid: 0,
          coursesPassed: 0,
          coursesFailed: 0,
          createdAt: Date.now()
        };
        await dbSet(`users/${user.uid}`, p);
        await dbSet(`emails/${emailKey}`, user.uid);
        await dbRemove(`pending/${emailKey}`);
        if (hasRole("student", p) && p.department && p.batch) {
          await dbSet(`deptStudents/${p.department}/${p.batch}/${user.uid}`, true);
          await dbSet(`roster/${p.department}/${user.uid}`, {
            name: p.name, email: p.email, batch: p.batch, rollNo: p.rollNo || "", feesTotal: p.feesTotal || 0
          });
          await dbSet(`fees/${user.uid}`, {
            name: p.name, email: p.email, department: p.department,
            total: p.feesTotal || 0, paid: 0, rollNo: p.rollNo || ""
          });
        }
        if (hasRole("teacher", p) && p.department) {
          await dbSet(`deptTeachers/${p.department}/${user.uid}`, true);
        }
        return p;
      }

      // No access
      return null;
    }

            <div class="user-chip" id="btn-my-profile" title="My public profile" style="cursor:pointer;">
              <img src="${esc(profile.photoURL || LOGO)}" alt="" onerror="this.src='${LOGO}'" />
              <span class="hide-sm">${esc(profile.name)}</span>
              ${switcher}
            </div>
            <button class="btn btn-outline" id="btn-logout">Logout</button>
          </div>
        </header>
        <main class="main" id="main-content">${contentHtml}</main>
        <footer class="footer">© Shah Abdul Latif University — LMS · Offline-capable</footer>
      `;
      document.getElementById("btn-logout").onclick = () => signOut(auth);
      document.getElementById("btn-home").onclick = () => renderLanding();
      document.getElementById("btn-dash").onclick = () => routeToRole();
      document.getElementById("btn-people").onclick = () => renderPeoplePage();
      const syncBtn = document.getElementById("btn-sync");
      if (syncBtn) syncBtn.onclick = async () => { await studentSyncCycle(); toast("Saved on this phone", "success"); routeToRole(); };
      document.getElementById("btn-my-profile").onclick = (e) => {
        if (e.target.closest("#role-switch")) return;
        openPublicProfile(profile.uid, hasRole("student") ? "student" : "dir");

      const sw = document.getElementById("role-switch");
      if (sw) sw.onchange = async () => {
        const next = sw.value;
        profile.activeRole = next;
        profile.role = next; // keep legacy field in sync for active view
        try { await dbUpdate(`users/${profile.uid}`, { activeRole: next, role: next }); } catch (_) {}
        await idbSet("profile", profile);

    // ─── Tabs helper ────────────────────────────────────────────
    function tabsHtml(tabs, active) {
      return `<div class="tabs">${tabs.map(t =>
        `<button class="tab ${t.id === active ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
      ).join("")}</div>`;

    function bindTabs(handler) {
      document.querySelectorAll(".tab").forEach(btn => {
        btn.onclick = () => { activeTab = btn.dataset.tab; handler(); };
      });
    }

    async function adminUsersHtml() {
      const pending = await dbGet("pending") || {};

      const staffRoles = ["teacher","clerk","finance","exam","admission","pvc"];

      // Hide invites whose email already belongs to a joined account. Never touch users/ here.
      const emailMap = await dbGet("emails") || {};
      const joinedEmails = new Set(
        Object.values(users).map(u => (u.email || "").toLowerCase().trim()).filter(Boolean)
      );
      const joinedNames = new Set(
        Object.values(users).map(u => (u.name || "").toLowerCase().trim()).filter(Boolean)
      );
      Object.keys(emailMap).forEach(k => joinedEmails.add(k.replace(/,/g, ".").toLowerCase()));
      for (const [ek, p] of Object.entries(pending)) {
        const email = (ek || "").replace(/,/g, ".").toLowerCase().trim();
        if (joinedEmails.has(email) || emailMap[ek]) {
          try { await dbRemove(`pending/${ek}`); } catch (_) {}
        }
      }
      let pendingRows = Object.entries(pending)
        .filter(([ek, p]) => {
          if (p.role === "student" || (p.roles && p.roles.student)) return false;
          const email = (ek || "").replace(/,/g, ".").toLowerCase().trim();
          const alt = (p.email || "").toLowerCase().trim();
          const name = (p.name || "").toLowerCase().trim();
          if (joinedEmails.has(email) || (alt && joinedEmails.has(alt))) return false;
          if (emailMap[ek]) return false;
          if (name && joinedNames.has(name) && joinedEmails.has(email)) return false;
          return true;
        })
        .map(([ek, p]) => {
          const rl = getRolesList(p);
          const badges = (rl.length ? rl : [p.role]).map(r => `<span class="badge badge-info" style="margin:0 2px;">${esc(ROLES[r]||r)}</span>`).join("");
          return `
        <tr>
          <td>${esc(p.name)}</td>
          <td>${esc(ek.replace(/,/g,"."))}</td>
          <td>${badges}</td>
          <td>${esc(p.department||"—")}</td>

        }).join("") || `<tr><td colspan="5" class="empty">No pending staff invitations</td></tr>`;

      let userRows = Object.entries(users)
        .filter(([_,u]) => {
          const rl = getRolesList(u);
          return !rl.includes("admin") && !rl.includes("student") && u.role !== "admin" && u.role !== "student";
        })
        .map(([uid, u]) => {

          return `
        <tr>
          <td><img class="avatar-sm" src="${esc(u.photoURL||LOGO)}" onerror="this.style.display='none'" style="vertical-align:middle;margin-right:0.4rem;" />${esc(u.name)}</td>
          <td>${esc(u.email)}</td>
          <td>${badges}</td>
          <td>${esc(u.department||"—")}</td>
          <td style="white-space:nowrap;">
            <button class="btn btn-outline btn-sm" data-add-role="${esc(uid)}">Add role</button>
            <button class="btn btn-outline btn-sm" data-hod="${esc(uid)}">${getRolesList(u).includes("hod") ? "Remove HOD" : "Make HOD"}</button>
            <button class="btn btn-danger btn-sm" data-del-user="${esc(uid)}">Delete</button>
          </td>
        </tr>`;
        }).join("") || `<tr><td colspan="5" class="empty">No staff users yet</td></tr>`;

      return `
        <div class="card">
          <div class="card-title">Invite Staff (not students)</div>
          <div class="alert alert-info">Students: Exam / Admission only. <strong>Tick one or more roles</strong> (e.g. Teacher + Exam Wing). Department required if Teacher or Clerk is selected. Same email can get extra roles later via “Add role”.</div>
          <form id="form-invite">
            <div class="form-row">
              <div class="form-group"><label>Full Name</label><input name="name" required /></div>
              <div class="form-group"><label>Email</label><input name="email" type="email" required /></div>
            </div>
            <div class="form-group">
              <label>Roles (multi-select)</label>
              <div style="display:flex;flex-wrap:wrap;gap:0.65rem 1rem;font-size:0.875rem;">
                <label><input type="checkbox" name="roles" value="teacher" checked /> Teacher</label>
                <label><input type="checkbox" name="roles" value="clerk" /> Clerk</label>
                <label><input type="checkbox" name="roles" value="finance" /> Finance</label>
                <label><input type="checkbox" name="roles" value="exam" /> Exam Wing</label>
                <label><input type="checkbox" name="roles" value="admission" /> Admission</label>

            <button type="submit" class="btn btn-primary">Invite Staff</button>
          </form>
        </div>
        <div class="card">
          <div class="card-title">Pending Staff Invitations</div>

            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Dept</th><th></th></tr></thead>

    function bindAdminHandlers() {
      const formInvite = document.getElementById("form-invite");
      if (formInvite) formInvite.onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(formInvite);
        const roleList = fd.getAll("roles").filter(Boolean);
        if (!roleList.length) {
          toast("Select at least one role", "error");
          return;
        }
        const department = fd.get("department") || "";
        if ((roleList.includes("teacher") || roleList.includes("clerk")) && !department) {
          toast("Department is required when Teacher or Clerk is selected", "error");
          return;
        }
        const email = fd.get("email").toLowerCase().trim();
        const emailKey = email.replace(/\./g, ",");
        try {
          // If user already exists, merge roles instead of only pending
          const existingUid = await dbGet(`emails/${emailKey}`);
          if (existingUid) {
            const u = await dbGet(`users/${existingUid}`);
            if (u) {
              const merged = [...new Set([...getRolesList(u), ...roleList])];
              const map = rolesToMap(merged);
              const updates = { roles: map };
              if (department && !u.department) updates.department = department;
              await dbUpdate(`users/${existingUid}`, updates);
              if (roleList.includes("teacher") && (department || u.department)) {
                await dbSet(`deptTeachers/${department || u.department}/${existingUid}`, true);
              }
              toast("Extra role(s) added to existing account. They can switch roles after refresh/login.", "success");
              renderAdmin();
              return;
            }
          }
          await dbSet(`pending/${emailKey}`, {
            name: fd.get("name").trim(),
            role: roleList[0],
            roles: rolesToMap(roleList),
            department,
            batch: fd.get("batch") || "",
            feesTotal: Number(fd.get("feesTotal")||0),
            invitedAt: Date.now()
          });
          toast("Invitation created with " + roleList.length + " role(s). User can sign in with Google.", "success");
          renderAdmin();
        } catch (err) {
          console.error(err);
          toast("Failed to save invite: " + (err.message || err.code || "permission denied — publish updated database rules"), "error");
        }
      };

      document.querySelectorAll("[data-add-role]").forEach(btn => {
        btn.onclick = async () => {
          const uid = btn.dataset.addRole;
          const u = await dbGet(`users/${uid}`);
          if (!u) return;
          const pick = prompt(
            "Add role for " + (u.name || "") + ".\nEnter one of: teacher, clerk, finance, exam, admission, pvc\nCurrent: " + getRolesList(u).join(", "),
            "exam"
          );
          if (!pick) return;
          const r = pick.trim().toLowerCase();
          if (!ROLES[r] || r === "admin" || r === "student") {
            toast("Invalid role", "error");
            return;
          }
          const merged = [...new Set([...getRolesList(u), r])];
          await dbUpdate(`users/${uid}`, { roles: rolesToMap(merged) });
          if (r === "teacher" && u.department) {
            await dbSet(`deptTeachers/${u.department}/${uid}`, true);
          }
          toast("Role added: " + (ROLES[r] || r) + ". Existing profile data was kept.", "success");
          renderAdmin();
        };
      });

      document.querySelectorAll("[data-hod]").forEach(btn => {
        btn.onclick = async () => {
          const uid = btn.dataset.hod;
          const u = await dbGet(`users/${uid}`);
          if (!u) return;
          const list = getRolesList(u);
          if (!list.includes("teacher") && u.role !== "teacher") {
            toast("HOD can only be assigned to a teacher", "error");
            return;
          }
          if (!u.department) {
            toast("Teacher needs a department before becoming HOD", "error");
            return;
          }
          if (list.includes("hod")) {
            if (!confirm("Remove HOD from " + (u.name || "this teacher") + "? Their teacher account and data stay.")) return;
            const next = list.filter(r => r !== "hod");
            const updates = { roles: rolesToMap(next) };
            if ((u.activeRole || u.role) === "hod") {
              updates.activeRole = "teacher";
              updates.role = "teacher";
            }
            await dbUpdate(`users/${uid}`, updates);
            toast("HOD removed. Teacher data kept.", "success");
          } else {
            if (!confirm("Make " + (u.name || "this teacher") + " HOD of their department? Other HOD in the same department will lose only the HOD role.")) return;

            for (const [oid, ou] of Object.entries(all)) {
              if (oid === uid) continue;
              if (ou.department === u.department && getRolesList(ou).includes("hod")) {
                const nl = getRolesList(ou).filter(r => r !== "hod");
                const upd = { roles: rolesToMap(nl) };
                if ((ou.activeRole || ou.role) === "hod") {
                  upd.activeRole = "teacher";
                  upd.role = "teacher";
                }
                await dbUpdate(`users/${oid}`, upd);
              }
            }
            await dbUpdate(`users/${uid}`, { roles: rolesToMap([...list, "hod"]) });
            toast("HOD assigned. Teacher profile unchanged.", "success");

          renderAdmin();

          toast("Updated", "success");
          renderAdmin();

      const formBatch = document.getElementById("form-batch");

          name: fd.get("name").trim(),
          department: fd.get("department"),
          year: fd.get("year").trim(),
          createdAt: Date.now()
        });
        toast("Batch added", "success");
        renderAdmin();
      };

      document.querySelectorAll("[data-del-batch]").forEach(b => {

          if (!confirm("Delete this batch and its student index?")) return;

    async function renderStudent() {
      clearListeners();
      const tabs = [
        { id: "dashboard", label: "Dashboard" },
        { id: "more", label: "Timetable · Marks · Leave" },
        { id: "profile", label: "Profile" }
      ];
      if (!tabs.find(t => t.id === activeTab)) activeTab = "dashboard";

      let body = "";
      if (activeTab === "dashboard") {
        const gpa = profile.gpa ?? 0;
        const feesRem = (profile.feesTotal || 0) - (profile.feesPaid || 0);
        const termBacks = profile.termBacks || 0;
        const subAtt = await dbGet(`subjectAtt/${profile.uid}`) || {};
        const subEntries = Object.entries(subAtt);

        let alerts = "";
        for (const [sub, s] of subEntries) {
          const pct = s.total ? (s.present / s.total) * 100 : 100;
          if (pct < 70) {
            alerts += `<div class="alert alert-danger">${ICONS.alert} <strong>${esc(sub)}</strong>: ${pct.toFixed(1)}% attendance — you cannot sit the exam for this subject (minimum 70%).</div>`;
          } else if (pct < 80) {
            alerts += `<div class="alert alert-warning">${ICONS.alert} <strong>${esc(sub)}</strong>: ${pct.toFixed(1)}% — attendance falling. Stay above 70%.</div>`;
          }
        }
        if (gpa > 0 && gpa < 1.7) {
          alerts += `<div class="alert alert-danger">${ICONS.alert} GPA ${gpa.toFixed(2)} — Term Back (${termBacks || 1}). Third term back = account removal.</div>`;
        } else if (gpa > 0 && gpa < 1.85) {
          alerts += `<div class="alert alert-warning">${ICONS.alert} GPA ${gpa.toFixed(2)} — near Term Back threshold (1.7).</div>`;
        }
        if (termBacks >= 2) {
          alerts += `<div class="alert alert-danger">Critical: ${termBacks} term backs. One more below 1.7 GPA removes your account.</div>`;
        }

        const attRows = subEntries.map(([sub, s]) => {
          const pct = s.total ? (s.present / s.total) * 100 : 100;
          const cls = pct < 70 ? "danger" : pct < 80 ? "warn" : "ok";
          return `<div class="stat-card ${cls}"><div class="stat-value">${pct.toFixed(0)}%</div><div class="stat-label">${esc(sub)}</div><div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.2rem;">${s.present}/${s.total} classes</div></div>`;
        }).join("") || `<div class="empty" style="grid-column:1/-1;padding:1rem;">No subject attendance yet</div>`;

        body = `
          ${alerts}
          <div class="grid-3">
            <div class="stat-card ${gpa > 0 && gpa < 1.7 ? 'danger' : gpa < 1.85 ? 'warn' : 'ok'}">
              <div class="stat-value">${gpa ? gpa.toFixed(2) : "—"}</div>
              <div class="stat-label">Aggregate GPA</div>
            </div>
            <div class="stat-card ${termBacks ? 'danger' : 'ok'}">
              <div class="stat-value">${termBacks}</div>
              <div class="stat-label">Term Backs</div>
            </div>
            <div class="stat-card ${feesRem > 0 ? 'warn' : 'ok'}">
              <div class="stat-value">${feesRem.toLocaleString()}</div>
              <div class="stat-label">Fees Remaining</div>
            </div>
          </div>
          <div class="card" style="margin-top:1rem;">
            <div class="card-title">${ICONS.book} Attendance by Subject</div>
            <div class="grid-3">${attRows}</div>
          </div>
          <div class="widget-grid" style="margin-top:1rem;">
            ${await calendarWidgetHtml()}
            <div class="card">
              <div class="card-title">${ICONS.book} Quick stats</div>
              <p style="font-size:0.9rem;color:var(--text-muted);">Passed: <strong>${profile.coursesPassed||0}</strong> · Failed: <strong>${profile.coursesFailed||0}</strong></p>
              <p style="font-size:0.9rem;color:var(--text-muted);margin-top:0.4rem;">Fees paid: ${(profile.feesPaid||0).toLocaleString()} PKR</p>
            </div>
          </div>
        `;
      } else if (activeTab === "more") {
        body = `
          ${await studentTimetableHtml()}
          ${await studentMarksHtml()}
          ${await studentAnnHtml()}
          ${leaveFormHtml("student")}
        `;
      } else if (activeTab === "people") {
        body = await peopleDirectoryHtml(false);
      } else if (activeTab === "profile") {
        body = profileEditHtml();
      }

      renderShell(`${tabsHtml(tabs, activeTab)}${body}`);
      bindTabs(renderStudent);
      bindProfileForm();
      bindPeopleHandlers(renderStudent);
      if (activeTab === "more") {
        bindLeaveForm(renderStudent);
        const msBtn = document.getElementById("btn-marksheet");
        if (msBtn) msBtn.onclick = () => openMarksheet();
      }
    }

    async function studentTimetableHtml() {
      if (!profile.department) return `<div class="card"><div class="empty">No department assigned.</div></div>`;
      const tt = await loadTimetable(profile.department);
      const today = dayName();
      let html = "";
      for (const day of DAYS) {
        const slots = tt[day] || {};
        const list = Object.entries(slots).sort((a,b) => timeToMin(a[1].start) - timeToMin(b[1].start));
        if (!list.length) continue;
        html += `<div class="card"><div class="card-title">${day}${day===today?' · Today':''}</div><div class="tt-grid">`;
        for (const [sid, s] of list) {
          const now = nowMinutes();
          const start = timeToMin(s.start);
          const end = timeToMin(s.end);
          let cls = "";
          if (day === today) {
            if (now >= start && now < end) cls = "current";
            else if (now < start && now >= start - 30) cls = "upcoming";
          }
          html += `<div class="tt-slot ${cls}">
            <div class="tt-time">${fmtTime(s.start)} – ${fmtTime(s.end)}</div>
            <div class="tt-subject">${esc(s.subject)}</div>
            <div class="tt-meta">${esc(s.teacherName||"")} · ${esc(s.room||"")}</div>
          </div>`;
        }
        html += `</div></div>`;
      }
      return html || `<div class="card"><div class="empty">No timetable published for your department yet.</div></div>`;
    }

    function gradePoint(total100) {
      if (total100 >= 85) return 4.0;
      if (total100 >= 80) return 3.7;
      if (total100 >= 75) return 3.3;
      if (total100 >= 70) return 3.0;
      if (total100 >= 65) return 2.7;
      if (total100 >= 60) return 2.3;
      if (total100 >= 55) return 2.0;
      if (total100 >= 50) return 1.7;
      if (total100 >= 45) return 1.3;
      if (total100 >= 40) return 1.0;
      return 0.0;
    }

    function letterGrade(total100) {
      if (total100 >= 85) return "A";
      if (total100 >= 80) return "A-";
      if (total100 >= 75) return "B+";
      if (total100 >= 70) return "B";
      if (total100 >= 65) return "B-";
      if (total100 >= 60) return "C+";
      if (total100 >= 55) return "C";
      if (total100 >= 50) return "C-";
      if (total100 >= 45) return "D+";
      if (total100 >= 40) return "D";
      return "F";
    }

    function attMarksFromPct(pct) {
      return Math.round(Math.min(100, Math.max(0, pct)) / 10 * 10) / 10; // 0–10 scale, 1 decimal
    }

            <td>${fin}/50</td>
            <td>${att}/10</td>

            <td><strong>${total}/100</strong></td>
            <td>${letterGrade(total)}</td>
            <td>${gp.toFixed(1)}</td>

    async function studentAnnHtml() {
      const anns = await dbGet("announcements") || {};
      const subAtt = await dbGet(`subjectAtt/${profile.uid}`) || {};
      const mySubjects = new Set(Object.values(subAtt).map(s => (s.subject || "").toLowerCase()).filter(Boolean));
      // Also subjects from marks
      const marks = await dbGet(`marks/${profile.uid}`) || {};
      Object.values(marks).forEach(m => { if (m.subject) mySubjects.add(m.subject.toLowerCase()); });

      const items = Object.entries(anns)
        .filter(([_,a]) => {
          if (a.department && a.department !== profile.department) return false;
          if (a.batch && profile.batch && a.batch !== profile.batch) return false;
          if (a.subject) {
            if (mySubjects.size === 0) return a.department === profile.department && (!a.batch || a.batch === profile.batch);
            return mySubjects.has(String(a.subject).toLowerCase());
          }
          return !a.department || a.department === profile.department;
        })
        .sort((a,b) => (b[1].ts||0)-(a[1].ts||0))
        .map(([_,a]) => `
          <div class="ann-item">
            <div class="ann-meta">${esc(a.byName||"")} · ${fmtDate(a.ts)}${a.subject ? ` · <span class="badge badge-info">${esc(a.subject)}</span>` : ""}</div>
            <div class="ann-body">${esc(a.text)}</div>
          </div>
        `).join("") || `<div class="empty">No announcements</div>`;
      return `<div class="card"><div class="card-title">Announcements</div>${items}</div>`;
    }

    function bindProfileForm() {
      const form = document.getElementById("form-profile");
      if (!form) return;
      form.onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const words = (fd.get("status") || "").trim().split(/\s+/).filter(Boolean);
        if (words.length > 200) { toast("Status must be 200 words or fewer", "error"); return; }
        const updates = {
          photoURL: fd.get("photoURL").trim(),
          bio: fd.get("bio").trim(),
          researchHistory: fd.get("researchHistory").trim(),
          education: (fd.get("education") || "").trim(),
          website: fd.get("website").trim(),
          status: (fd.get("status") || "").trim(),
          social: {
            linkedin: fd.get("linkedin").trim(),
            twitter: fd.get("twitter").trim(),
            facebook: fd.get("facebook").trim(),
            orcid: fd.get("orcid").trim()
          }
        };
        await dbUpdate(`users/${profile.uid}`, updates);
        Object.assign(profile, updates);
        await publishDirectory(profile);
        toast("Profile saved", "success");
        // re-render current role view
        routeToRole();
      };
      const photoInp = form.querySelector('[name="photoURL"]');
      if (photoInp) photoInp.oninput = () => {
        const img = document.getElementById("preview-avatar");
        if (img && photoInp.value) img.src = photoInp.value;
      };
      renderWorksLists();
      const formPaper = document.getElementById("form-paper");
      if (formPaper) formPaper.onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(formPaper);
        const papers = Array.isArray(profile.papers) ? profile.papers.slice() : Object.values(profile.papers || {});
        papers.push({ title: fd.get("title").trim(), link: (fd.get("link")||"").trim(), abstract: (fd.get("abstract")||"").trim(), ts: Date.now() });
        await dbSet(`directory/${profile.uid}/papers`, papers);
        await dbUpdate(`users/${profile.uid}`, { papers: null });
        profile.papers = papers;
        toast("Paper added", "success");
        renderWorksLists();
        formPaper.reset();
      };
      const formBook = document.getElementById("form-book");
      if (formBook) formBook.onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(formBook);
        const books = Array.isArray(profile.books) ? profile.books.slice() : Object.values(profile.books || {});
        books.push({ title: fd.get("title").trim(), coverURL: (fd.get("coverURL")||"").trim(), buyURL: (fd.get("buyURL")||"").trim(), ts: Date.now() });
        await dbSet(`directory/${profile.uid}/books`, books);
        await dbUpdate(`users/${profile.uid}`, { books: null });
        profile.books = books;
        toast("Book added", "success");
        renderWorksLists();
        formBook.reset();
      };
    }

    function renderWorksLists() {
      const papers = Array.isArray(profile.papers) ? profile.papers : Object.values(profile.papers || {});
      const books = Array.isArray(profile.books) ? profile.books : Object.values(profile.books || {});
      const pBox = document.getElementById("paper-list");
      if (pBox) pBox.innerHTML = papers.map((p, i) => `
        <div class="att-row" style="margin-bottom:0.35rem;align-items:flex-start;">
          <span><strong>${esc(p.title)}</strong>${p.link ? ` · <a href="${esc(p.link)}" target="_blank" rel="noopener">Link</a>` : ""}<div style="font-size:0.8rem;color:var(--text-muted);">${esc(p.abstract||"")}</div></span>
          <button class="btn btn-danger btn-sm" data-del-paper="${i}">Remove</button>
        </div>`).join("") || `<div class="empty" style="padding:0.4rem;">No papers yet</div>`;
      const bBox = document.getElementById("book-list");
      if (bBox) bBox.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.75rem;">` + (books.map((b, i) => `
        <div class="card" style="padding:0.6rem;margin:0;">
          ${b.coverURL ? `<img src="${esc(b.coverURL)}" alt="" style="width:100%;height:160px;object-fit:cover;border-radius:8px;" />` : ""}
          <div style="font-weight:600;font-size:0.85rem;margin-top:0.4rem;">${esc(b.title)}</div>
          ${b.buyURL ? `<a href="${esc(b.buyURL)}" target="_blank" rel="noopener" style="font-size:0.8rem;">Buy</a>` : ""}
          <button class="btn btn-danger btn-sm" data-del-book="${i}" style="margin-top:0.35rem;">Remove</button>
        </div>`).join("") || `<div class="empty">No books yet</div>`) + `</div>`;
      document.querySelectorAll("[data-del-paper]").forEach(btn => {
        btn.onclick = async () => {
          const papers2 = (Array.isArray(profile.papers) ? profile.papers : Object.values(profile.papers || {})).filter((_, i) => i !== Number(btn.dataset.delPaper));
          await dbUpdate(`users/${profile.uid}`, { papers: papers2 });
          profile.papers = papers2;
          await publishDirectory(profile);
          renderWorksLists();
        };
      });
      document.querySelectorAll("[data-del-book]").forEach(btn => {
        btn.onclick = async () => {
          const books2 = (Array.isArray(profile.books) ? profile.books : Object.values(profile.books || {})).filter((_, i) => i !== Number(btn.dataset.delBook));
          await dbSet(`directory/${profile.uid}/books`, books2);
          await dbUpdate(`users/${profile.uid}`, { books: null });
          profile.books = books2;
          await publishDirectory(profile);
          renderWorksLists();
        };
      });
    }

    async function publishDirectory(p) {
      if (!p || !p.uid) return;
      const roles = getRolesList(p);
      if (roles.includes("student")) return;
      try {
        await dbSet(`directory/${p.uid}`, {
          uid: p.uid,
          name: p.name || "",
          email: p.email || "",
          photoURL: p.photoURL || "",
          role: p.role || roles[0] || "",
          roles: rolesToMap(roles),
          department: p.department || "",
          bio: p.bio || "",
          status: p.status || "",
          website: p.website || "",
          researchHistory: p.researchHistory || "",
          education: p.education || "",
          rank: p.rank || "",
          papers: p.papers || [],
          books: p.books || [],
          social: p.social || {}
        });
      } catch (_) {}
    }

    async function renderTeacher() {
      clearListeners();
      const tabs = [
        { id: "dashboard", label: "Dashboard" },
        { id: "attendance", label: "Attendance" },
        { id: "marks", label: "Marks / Exams" },
        { id: "profile", label: "Profile · Leave · Bills" }
      ];
      if (!tabs.find(t => t.id === activeTab)) activeTab = "dashboard";

      let body = "";
      if (activeTab === "dashboard") {
        body = await teacherDashHtml();
      } else if (activeTab === "attendance") {
        body = await teacherAttHtml();
      } else if (activeTab === "marks") {
        body = (await teacherMarksHtml()) + (await teacherAnnHtml());
      } else if (activeTab === "people") {
        body = await peopleDirectoryHtml(true);
      } else if (activeTab === "profile") {
        body = profileEditHtml() + leaveFormHtml("teacher") + `
          <div class="card">
            <div class="card-title">${ICONS.bill} Submit Pending Bill</div>
            <form id="form-bill">
              <div class="form-group"><label>Description</label><input name="description" required placeholder="e.g. Lab equipment" /></div>
              <div class="form-row">
                <div class="form-group"><label>Amount (PKR)</label><input name="amount" type="number" min="0" required /></div>
                <div class="form-group"><label>Receipt / image URL</label><input name="imageURL" placeholder="https://..." /></div>
              </div>
              <button type="submit" class="btn btn-primary">Submit Bill</button>
            </form>
            <div id="my-bills" style="margin-top:1rem;"></div>
          </div>`;
      }

      renderShell(`${tabsHtml(tabs, activeTab)}${body}`);
      bindTabs(renderTeacher);
      bindProfileForm();
      bindTeacherHandlers();
      bindPeopleHandlers(renderTeacher);
      document.querySelectorAll("[data-goto-tab]").forEach(b => {
        b.onclick = () => { activeTab = b.dataset.gotoTab; renderTeacher(); };
      });
      if (activeTab === "profile") {
        bindLeaveForm(renderTeacher);
        const formBill = document.getElementById("form-bill");
        if (formBill) formBill.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(formBill);
          try {
            const id = pushId("bills");
            await dbSet(`bills/${id}`, {
              by: profile.uid, byName: profile.name,
              description: fd.get("description").trim(),
              amount: Number(fd.get("amount")),
              imageURL: (fd.get("imageURL")||"").trim(),
              status: "pending", ts: Date.now()
            });
            toast("Bill submitted", "success");
            renderTeacher();
          } catch (err) { toast("Failed: " + (err.message||err.code), "error"); }
        };
        const bills = await dbGet("bills") || {};
        const mine = Object.entries(bills).filter(([_,b]) => b.by === profile.uid);
        const box = document.getElementById("my-bills");
        if (box) box.innerHTML = mine.length ? mine.map(([id,b]) => `
          <div class="att-row" style="margin-bottom:0.35rem;">
            <span>${esc(b.description)} — ${Number(b.amount).toLocaleString()} PKR
              <span class="badge ${b.status==="pending"?"badge-warning":"badge-success"}">${esc(b.status)}</span>
            </span>
            ${b.status==="pending" ? `<button class="btn btn-success btn-sm" data-pay-bill="${esc(id)}">Mark Paid</button>` : ""}
          </div>`).join("") : `<div class="empty" style="padding:0.5rem;">No bills yet</div>`;
        document.querySelectorAll("[data-pay-bill]").forEach(btn => {
          btn.onclick = async () => {
            await dbRemove(`bills/${btn.dataset.payBill}`);
            toast("Bill resolved", "success");
            renderTeacher();
          };
        });
      }
    }

    async function teacherDashHtml() {
      if (!profile.department) return `<div class="card"><div class="empty">No department assigned.</div></div>`;
      const tt = await loadTimetable(profile.department);
      const today = dayName();
      const slots = Object.entries(tt[today] || {}).filter(([_,s]) => s.teacherId === profile.uid)
        .sort((a,b) => timeToMin(a[1].start) - timeToMin(b[1].start));

      const now = nowMinutes();
      let current = null, upcoming = null;
      for (const [sid, s] of slots) {
        const start = timeToMin(s.start);
        const end = timeToMin(s.end);
        if (now >= start && now < end) current = { sid, ...s };
        else if (now < start && (!upcoming || start < timeToMin(upcoming.start))) upcoming = { sid, ...s };
      }

      // 10-min prep notification
      let prepAlert = "";
      if (upcoming) {
        const minsLeft = timeToMin(upcoming.start) - now;
        if (minsLeft > 0 && minsLeft <= 10) {
          prepAlert = `<div class="alert alert-info">📚 Prep for class: <strong>${esc(upcoming.subject)}</strong> starts in ${minsLeft} min (${fmtTime(upcoming.start)}).</div>`;
        }
      }

      return `
        ${prepAlert}
        <div class="grid-2">
          <div class="card">
            <div class="card-title">${ICONS.check} Attendance</div>
            <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:0.75rem;">
              ${slots.length
                ? `${slots.length} class(es) on timetable today.`
                : "No classes on your timetable for today. Clerk must assign you in the department timetable first."}
            </p>
            ${current ? `
              <div class="tt-slot current">
                <div class="tt-time">${fmtTime(current.start)} – ${fmtTime(current.end)}</div>
                <div class="tt-subject">${esc(current.subject)}</div>
                <div class="tt-meta">${esc(current.room||"")} · ${esc(current.batchName||current.batch||"")}</div>
              </div>
              <button class="btn btn-success" style="margin-top:0.75rem;" data-take-att="${esc(current.sid)}" data-batch="${esc(current.batch||'')}" data-subject="${esc(current.subject)}">Take Attendance Now</button>
            ` : `<div class="empty" style="padding:0.75rem;">No class in progress right now</div>`}
            <button class="btn btn-primary btn-sm" style="margin-top:0.75rem;" data-goto-tab="attendance">Open Attendance</button>
          </div>
          <div class="card">
            <div class="card-title">${ICONS.book} Marks / Exams</div>
            <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:0.75rem;">
              Upload midterm (30), final (50), presentation (10). Attendance (10) is auto-calculated.
            </p>
            <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.75rem;">
              Needs: batches + students in your department (Admission/Exam Wing), then pick batch &amp; subject.
            </p>
            <button class="btn btn-primary btn-sm" data-goto-tab="marks">Open Marks / Exams</button>
          </div>
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-title">Upcoming Today</div>
            ${upcoming ? `
              <div class="tt-slot upcoming">
                <div class="tt-time">${fmtTime(upcoming.start)} – ${fmtTime(upcoming.end)}</div>
                <div class="tt-subject">${esc(upcoming.subject)}</div>
                <div class="tt-meta">${esc(upcoming.room||"")}</div>
              </div>
            ` : `<div class="empty">No more classes today</div>`}
          </div>
          <div class="card">
            <div class="card-title">Today's Schedule</div>
            <div class="tt-grid">
              ${slots.map(([sid,s]) => {
                const start = timeToMin(s.start), end = timeToMin(s.end);
                let cls = "";
                if (now >= start && now < end) cls = "current";
                else if (now < start) cls = "upcoming";
                return `<div class="tt-slot ${cls}">
                  <div class="tt-time">${fmtTime(s.start)} – ${fmtTime(s.end)}</div>
                  <div class="tt-subject">${esc(s.subject)}</div>
                  <div class="tt-meta">${esc(s.room||"")} · ${esc(s.batchName||"")}</div>
                </div>`;
              }).join("") || `<div class="empty">No classes scheduled today — ask Clerk to add timetable slots with your name</div>`}
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">${ICONS.calendar} Weekly schedule</div>
          <div class="tt-grid">
            ${DAYS.map(day => {
              const daySlots = Object.entries(tt[day] || {}).filter(([_,s]) => s.teacherId === profile.uid)
                .sort((a,b) => timeToMin(a[1].start) - timeToMin(b[1].start));
              if (!daySlots.length) return "";
              return daySlots.map(([_,s]) => `<div class="tt-slot">
                <div class="tt-time">${day} · ${fmtTime(s.start)} – ${fmtTime(s.end)}</div>
                <div class="tt-subject">${esc(s.subject)}</div>
                <div class="tt-meta">${esc(s.batchName||s.batch||"")} · ${esc(s.room||"")}</div>
              </div>`).join("");
            }).join("") || `<div class="empty">No weekly classes assigned yet</div>`}
          </div>
        </div>
        ${await calendarWidgetHtml()}
      `;
    }

    async function teacherAttHtml() {
      // List today's classes for this teacher so they can pick one
      if (!profile.department) return `<div class="card"><div class="empty">No department</div></div>`;
      const tt = await loadTimetable(profile.department);
      const today = dayName();
      const slots = Object.entries(tt[today] || {}).filter(([_,s]) => s.teacherId === profile.uid);

      // From dashboard "Take Attendance Now" — only if still inside class window
      const params = window.__attParams;
      if (params) {
        window.__attParams = null;
        const slot = slots.find(([sid]) => sid === params.sid);
        if (slot) {
          const now = nowMinutes();
          const start = timeToMin(slot[1].start), end = timeToMin(slot[1].end);
          if (now >= start && now < end) {
            return await buildAttendanceForm(params.sid, params.batch, params.subject);
          }
          toast("Attendance only during class time (" + fmtTime(slot[1].start) + " – " + fmtTime(slot[1].end) + ")", "error");
        }
      }

      if (!slots.length) return `<div class="card">
        <div class="card-title">${ICONS.check} Take Attendance</div>
        <div class="alert alert-info">No classes on your timetable for <strong>today (${today})</strong>.</div>
        <p style="font-size:0.9rem;color:var(--text-muted);">To take attendance you need:</p>
        <ol style="font-size:0.9rem;color:var(--text-muted);margin:0.5rem 0 0 1.25rem;line-height:1.7;">
          <li>A <strong>department</strong> on your profile (Admin assigns when inviting)</li>
          <li><strong>Clerk</strong> adds a timetable slot with you as teacher (use @ your name)</li>
          <li>Slot must be for <strong>today’s weekday</strong></li>
          <li>Slot should include a <strong>batch</strong> that has students (Admission/Exam Wing)</li>
        </ol>
      </div>`;

      const now = nowMinutes();
      return `
        <div class="card">
          <div class="card-title">Select Class for Attendance (${today})</div>
          <div class="alert alert-info">Attendance can only be taken <strong>during the class time</strong> on the timetable (start → end).</div>
          <div class="tt-grid">
            ${slots.map(([sid, s]) => {
              const start = timeToMin(s.start), end = timeToMin(s.end);
              const inWindow = now >= start && now < end;
              const past = now >= end;
              let status = inWindow ? "current" : (now < start ? "upcoming" : "");
              return `
              <div class="tt-slot ${status}">
                <div class="tt-time">${fmtTime(s.start)} – ${fmtTime(s.end)}</div>
                <div class="tt-subject">${esc(s.subject)}</div>
                <div class="tt-meta">${esc(s.batchName||s.batch||"")}</div>
                ${inWindow
                  ? `<button class="btn btn-success btn-sm" style="margin-top:0.5rem;" data-take-att="${esc(sid)}" data-batch="${esc(s.batch||'')}" data-subject="${esc(s.subject)}">Take Attendance</button>`
                  : past
                    ? `<span class="badge badge-warning" style="margin-top:0.5rem;display:inline-block;">Class ended — window closed</span>`
                    : `<span class="badge badge-info" style="margin-top:0.5rem;display:inline-block;">Not started yet</span>`}
              </div>`;
            }).join("")}
          </div>
        </div>
      `;
    }

    async function buildAttendanceForm(slotId, batchId, subject) {
      const date = todayStr();
      const attKey = `${profile.department}_${slotId}_${date}`;
      const existing = await dbGet(`attendance/${attKey}`);

      if (existing && existing.locked) {
        const lockedAt = existing.lockedAt || existing.submittedAt;
        return `<div class="card">
          <div class="alert alert-warning">This attendance was submitted and locked at ${fmtDate(lockedAt)} ${new Date(lockedAt).toLocaleTimeString()}. It can no longer be edited.</div>
          <div class="card-title">${esc(subject)} · ${date}</div>
          <div class="att-list">
            ${Object.entries(existing.records||{}).map(([uid, rec]) => `
              <div class="att-row ${rec.present ? 'present' : 'absent'}">
                <span>${esc(rec.name||uid)}</span>
                <span class="badge ${rec.present ? 'badge-success' : 'badge-danger'}">${rec.present ? 'Present' : 'Absent'}</span>
              </div>
            `).join("")}
          </div>
        </div>`;
      }

      // Load students of batch
      let studentIds = [];
      if (batchId && profile.department) {
        const idx = await dbGet(`deptStudents/${profile.department}/${batchId}`) || {};
        studentIds = Object.keys(idx);
      }
      const students = [];
      for (const uid of studentIds) {
        const u = await dbGet(`users/${uid}`);
        if (u) {
          const onLeave = await isOnApprovedLeave(uid, date);
          students.push({ uid, name: u.name, email: u.email, onLeave });
        }
      }
      students.sort((a,b) => a.name.localeCompare(b.name));

      if (!students.length) {
        return `<div class="card"><div class="empty">No students found in this batch. Ensure students are invited with the correct batch.</div></div>`;
      }

      const prev = existing?.records || {};
      return `
        <div class="card">
          <div class="card-title">Attendance — ${esc(subject)} · ${date}</div>
          <div class="alert alert-info">Locks 15 min after submit. Students on approved leave are auto-marked Leave.</div>
          <div class="att-list" id="att-list">
            ${students.map(s => {
              const was = prev[s.uid];
              const onLeave = s.onLeave;
              const present = onLeave ? true : (was ? was.present : true);
              const leaveFlag = onLeave || (was && was.leave);
              return `
                <div class="att-row ${leaveFlag ? 'present' : (present ? 'present' : 'absent')}" data-uid="${esc(s.uid)}" data-name="${esc(s.name)}" data-leave="${leaveFlag ? '1' : '0'}">
                  <span>${esc(s.name)}${leaveFlag ? ' <span class="badge badge-info">Leave</span>' : ''}</span>
                  ${leaveFlag ? `<span class="badge badge-info">On Leave</span>` : `
                  <div class="att-toggle">
                    <button class="btn btn-sm ${present ? 'btn-success' : 'btn-outline'}" data-p="1">Present</button>
                    <button class="btn btn-sm ${!present ? 'btn-danger' : 'btn-outline'}" data-p="0">Absent</button>
                  </div>`}
                </div>
              `;
            }).join("")}
          </div>
          <button class="btn btn-primary" style="margin-top:1rem;" id="btn-submit-att"
            data-key="${esc(attKey)}" data-slot="${esc(slotId)}" data-batch="${esc(batchId)}" data-subject="${esc(subject)}">
            Submit Attendance
          </button>
        </div>
      `;
    }

    async function teacherAnnHtml() {
      const anns = await dbGet("announcements") || {};
      const tt = profile.department ? (await loadTimetable(profile.department)) : {};
      const subjects = new Map();
      for (const day of DAYS) {
        for (const [sid, s] of Object.entries(tt[day] || {})) {
          if (s.teacherId !== profile.uid || !s.subject) continue;
          const key = s.subject;
          if (!subjects.has(key)) subjects.set(key, { subject: s.subject, batch: s.batch || "", batchName: s.batchName || "" });
        }
      }
      const subOpts = [...subjects.values()].map(s =>
        `<option value="${esc(s.subject)}" data-batch="${esc(s.batch)}">${esc(s.subject)}${s.batchName ? " · " + esc(s.batchName) : ""}</option>`
      ).join("");
      const items = Object.entries(anns)
        .filter(([_,a]) => a.by === profile.uid || a.department === profile.department)
        .sort((a,b) => (b[1].ts||0)-(a[1].ts||0))
        .map(([id,a]) => `
          <div class="ann-item">
            <div class="ann-meta">${esc(a.byName||"")} · ${fmtDate(a.ts)}${a.subject ? ` · <span class="badge badge-info">${esc(a.subject)}</span>` : ""}</div>
            <div class="ann-body">${esc(a.text)}</div>
            ${a.by === profile.uid ? `<button class="btn btn-danger btn-sm" data-del-ann="${esc(id)}">Delete</button>` : ""}
          </div>
        `).join("") || `<div class="empty">No announcements</div>`;
